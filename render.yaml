services:
  - type: web
    name: amazon-sales-predictor
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: python run_prod.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RENDER
        value: "true"
