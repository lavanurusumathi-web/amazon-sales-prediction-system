services:
  - type: web
    name: amazon-sales-predictor
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python pretrain.py
    startCommand: python run_prod.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RENDER
        value: "true"
